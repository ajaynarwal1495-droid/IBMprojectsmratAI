# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — SmartStudy AI (Production)
#
# Starts the backend service.
# Frontend is served separately (IBM COS + CDN or a static server).
#
# Usage:
#   docker-compose up --build
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smartstudy-backend:latest
    container_name: smartstudy-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=False
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
