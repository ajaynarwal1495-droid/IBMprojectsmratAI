# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.dev.yml — SmartStudy AI (Local Development)
#
# Starts both the backend (with hot reload) and the frontend Vite dev server.
#
# Usage:
#   docker-compose -f docker-compose.dev.yml up --build
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── Backend (FastAPI + uvicorn with --reload) ────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartstudy-backend-dev
    ports:
      - "8000:8000"
    volumes:
      # Mount source code so uvicorn --reload picks up changes instantly
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DEBUG=True
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # ── Frontend (Vite dev server) ────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: smartstudy-frontend-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      # Mount source code so Vite HMR works
      - ./frontend:/app
      # Use a named volume for node_modules to avoid overwriting the container's install
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
